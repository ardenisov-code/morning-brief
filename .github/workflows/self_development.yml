name: Evening Self-Development Briefing

on:
  schedule:
    # Avoid heavily contended :00 schedule slot. Every day at 20:17 MSK.
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Send a clearly labelled test without changing delivery history"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: evening-self-development
  cancel-in-progress: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install requests

      - name: Run briefing
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          SELFDEV_TEST_MODE: ${{ inputs.test_mode || 'false' }}
        run: python3 self_development.py

      - name: Save completed topic history
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add evening_history.json || true
          git diff --cached --quiet || git commit -m "chore: evening briefing history $(date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((attempt * 2))
          done
          exit 1
