name: AI Digest

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      force_ai:
        description: "Force paid AI synthesis for a test run"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI digest
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          FORCE_AI: ${{ inputs.force_ai && '1' || '0' }}
        run: python ai_digest.py

      - name: Commit digest to repo
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add digests/ || true
          git diff --cached --quiet || git commit -m "chore: ai digest $(date +%F)"
          git push
